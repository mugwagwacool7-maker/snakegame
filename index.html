<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@500&display=swap');
 
  :root{
    --bg: #14161c;
    --panel: #1b1e26;
    --border: #2a2e3a;
    --text: #e8e6df;
    --text-dim: #8b8f9c;
    --snake: #7fb069;
    --snake-head: #a3d977;
    --fruit: #e0a458;
    --bad: #d9636c;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 24px 16px 40px;
  }
  h1{
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    margin: 0 0 4px;
  }
  .sub{
    color: var(--text-dim);
    font-size: 12px;
    margin: 0 0 18px;
  }
  .hud{
    display:flex;
    gap: 20px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .hud span{ color: var(--text-dim); }
  .hud b{ color: var(--text); }
 
  #boardWrap{
    position:relative;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel);
    padding: 8px;
  }
  canvas{
    display:block;
    image-rendering: pixelated;
  }
 
  .overlay{
    position:absolute;
    inset: 8px;
    background: rgba(14,16,21,0.88);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 14px;
    text-align:center;
    padding: 20px;
  }
  .overlay.hidden{ display:none; }
  .overlay h2{
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    margin:0;
  }
  .overlay p{
    font-size: 12px;
    color: var(--text-dim);
    margin:0;
    line-height:1.6;
  }
  button{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: #0e1015;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 18px;
    cursor:pointer;
  }
  button:hover{ border-color: var(--text-dim); }
 
  .controls{
    margin-top: 18px;
    display:grid;
    grid-template-columns: repeat(3, 42px);
    grid-template-rows: repeat(2, 42px);
    gap: 6px;
    justify-content:center;
  }
  .controls button{
    padding:0;
    font-size: 16px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .c-up{ grid-column: 2; grid-row: 1; }
  .c-left{ grid-column: 1; grid-row: 2; }
  .c-down{ grid-column: 2; grid-row: 2; }
  .c-right{ grid-column: 3; grid-row: 2; }
 
  .hint{
    margin-top: 14px;
    font-size: 11px;
    color: var(--text-dim);
    text-align:center;
  }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <p class="sub">arrow keys or WASD — eat the fruit, don't hit yourself</p>
 
  <div class="hud">
    <span>score <b id="score">0</b></span>
    <span>best <b id="best">0</b></span>
    <span>length <b id="length">3</b></span>
  </div>
 
  <div id="boardWrap">
    <canvas id="board" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2>SNAKE</h2>
      <p>Use arrow keys or WASD to move.<br>Eat fruit to grow. Don't hit the walls or yourself.</p>
      <button onclick="startGame()">Start</button>
    </div>
  </div>
 
  <div class="controls">
    <button class="c-up" onclick="setDir(0,-1)">↑</button>
    <button class="c-left" onclick="setDir(-1,0)">←</button>
    <button class="c-down" onclick="setDir(0,1)">↓</button>
    <button class="c-right" onclick="setDir(1,0)">→</button>
  </div>
 
  <p class="hint">on-screen controls for touch/mobile — keyboard works too</p>
 
<script>
const CELL = 20;
const COLS = 20;
const ROWS = 20;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
 
let snake, dir, nextDir, fruit, score, best, running, tickMs, loopHandle;
 
best = 0;
 
function resetState(){
  snake = [ {x:9,y:10}, {x:8,y:10}, {x:7,y:10} ];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0;
  tickMs = 130;
  fruit = spawnFruit();
  updateHud();
}
 
function spawnFruit(){
  let pos;
  do {
    pos = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  return pos;
}
 
function setDir(x, y){
  // prevent reversing directly into itself
  if (snake.length > 1 && x === -dir.x && y === -dir.y) return;
  nextDir = { x, y };
}
 
window.addEventListener('keydown', (e) => {
  const map = {
    ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
    w: [0,-1], s: [0,1], a: [-1,0], d: [1,0],
    W: [0,-1], S: [0,1], A: [-1,0], D: [1,0],
  };
  if (map[e.key]){
    e.preventDefault();
    setDir(map[e.key][0], map[e.key][1]);
  }
  if (e.key === ' ' && !running){
    startGame();
  }
});
 
function updateHud(){
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('length').textContent = snake.length;
}
 
function draw(){
  ctx.fillStyle = '#1b1e26';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
 
  // subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  for (let i = 1; i < COLS; i++){
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
  }
  for (let j = 1; j < ROWS; j++){
    ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(canvas.width,j*CELL); ctx.stroke();
  }
 
  // fruit
  ctx.fillStyle = '#e0a458';
  const fx = fruit.x*CELL, fy = fruit.y*CELL;
  ctx.beginPath();
  ctx.arc(fx+CELL/2, fy+CELL/2, CELL/2 - 3, 0, Math.PI*2);
  ctx.fill();
 
  // snake
  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? '#a3d977' : '#7fb069';
    ctx.fillRect(seg.x*CELL+1, seg.y*CELL+1, CELL-2, CELL-2);
  });
}
 
function step(){
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
 
  const hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
 
  if (hitWall || hitSelf){
    gameOver();
    return;
  }
 
  snake.unshift(head);
 
  if (head.x === fruit.x && head.y === fruit.y){
    score += 10;
    fruit = spawnFruit();
    tickMs = Math.max(60, tickMs - 2);
  } else {
    snake.pop();
  }
 
  updateHud();
  draw();
  loopHandle = setTimeout(step, tickMs);
}
 
function gameOver(){
  running = false;
  if (score > best) best = score;
  updateHud();
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h2>Game over</h2>
    <p>Score: ${score} &nbsp;·&nbsp; Length: ${snake.length}</p>
    <button onclick="startGame()">Play again</button>
  `;
}
 
function startGame(){
  clearTimeout(loopHandle);
  resetState();
  overlay.classList.add('hidden');
  running = true;
  draw();
  loopHandle = setTimeout(step, tickMs);
}
 
resetState();
draw();
</script>
</body>
</html>
